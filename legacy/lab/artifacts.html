<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Artifacts - the drawings in the archive</title>
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{margin:0;background:#0a0908;color:#e9e2d3;font:12px/1.4 ui-monospace,Consolas,monospace}
  main{padding:24px}
  canvas{display:block;background:#0a0908;max-width:100%}
</style>
</head>
<body>
<main>
  <canvas id="c" width="1800" height="1250"></canvas>
</main>
<script src="../js/core.js"></script>
<script src="../js/glyphs.js"></script>
<script src="../js/artifacts.js"></script>
<script>
/* every artifact, drawn as exact strokes with the survey ticks the piece adds to free ends: how they look at their most resolved */
(function () {
  var G = SID.Glyphs, A = SID.Artifacts, ctx = document.getElementById('c').getContext('2d');
  var cols = 5, cw = 350, ch = 300, S = 200;
  A.list.forEach(function (a, i) {
    var d = G.defs[a.glyph], ox = (i % cols) * cw + 40, oy = Math.floor(i / cols) * ch + 250;
    ctx.strokeStyle = 'rgba(233,226,211,.95)'; ctx.lineWidth = 1.3;
    d.s.forEach(function (p) { ctx.beginPath(); p.forEach(function (q, k) { var x = ox + q[0] * S * 0.86, y = oy - q[1] * S * 0.86; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); });
    if (!d.nt) {
      ctx.strokeStyle = 'rgba(233,226,211,.55)';
      G.ticksFor(d.s).forEach(function (p) { ctx.beginPath(); p.forEach(function (q, k) { var x = ox + q[0] * S * 0.86, y = oy - q[1] * S * 0.86; k ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.stroke(); });
    }
    ctx.fillStyle = 'rgba(233,226,211,.5)'; ctx.font = '11px monospace'; ctx.fillText(a.proj + ' / ' + a.label, ox, oy + 26);
  });
})();
</script>
</body>
</html>
